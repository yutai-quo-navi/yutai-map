<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>優待を登録</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color:#18372e;background:#f5f7f3;font-size:16px}*{box-sizing:border-box}body{margin:0;padding-bottom:95px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:default}header{padding:25px 20px 16px;max-width:620px;margin:auto}header small{font-size:11px;letter-spacing:.18em;color:#557768}h1{font-size:27px;margin:7px 0}header p{font-size:13px;color:#607469;margin:5px 0}.shell{max-width:620px;margin:auto;padding:0 16px}nav{display:flex;gap:6px;padding:5px;background:#e7ede6;border-radius:14px;margin:10px 0 20px}nav button{flex:1;padding:12px 4px;border-radius:10px;background:none;font-weight:650;color:#52675b}nav button.active{background:white;color:#174c38;box-shadow:0 2px 6px #163e2910}.card{background:white;border:1px solid #e0e8dc;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #163e2904}.card h2{font-size:19px;margin:0 0 8px}.subtle{color:#708073;font-size:13px;line-height:1.7}.photo-choice{display:block;text-align:center;padding:29px 16px;border:1.5px dashed #a8b9a5;background:#f7faf5;border-radius:15px;color:#355d43;margin:17px 0}.photo-choice strong{display:block;margin-bottom:7px;font-size:17px}.photo-choice input{position:absolute;width:1px;height:1px;opacity:0}.icon{display:block;font-size:32px;margin:0 0 8px}.btn{background:#1d6245;color:white;border-radius:12px;padding:14px 18px;font-weight:650;min-height:48px}.btn.light{background:#edf2e9;color:#355c44}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.tag{display:inline-block;background:#f0f3eb;color:#566948;border-radius:6px;padding:4px 8px;font-size:11px}.tag.warn{background:#fff0d8;color:#966015}label.field{display:block;font-size:13px;font-weight:600;margin:18px 0}input,select,textarea{display:block;width:100%;min-height:49px;padding:12px;border:1px solid #ccd7c7;border-radius:11px;background:white;color:#18372e;margin-top:8px;outline-offset:3px}textarea{min-height:86px}input:focus,select:focus,textarea:focus{outline:2px solid #337653}input[type=checkbox]{width:21px;height:21px;min-height:0;display:inline-block;margin:0;accent-color:#22664a}#notice{padding:12px 15px;border-radius:12px;background:#ebf2e6;font-size:13px;line-height:1.7;margin:12px 0}#notice.error{background:#fff0e9;color:#92391f}.bottom{position:fixed;left:0;right:0;bottom:0;background:#ffffffed;border-top:1px solid #dfe6dc;padding:12px 16px max(12px,env(safe-area-inset-bottom));z-index:10}.bottom-inner{max-width:588px;margin:auto}.bottom button{width:100%}.results button,.record{display:block;width:100%;text-align:left;background:white;border:1px solid #e1e8dd;border-radius:13px;padding:15px;margin-top:7px;color:#244737}.results small,.record small{display:block;color:#6f8071;margin-top:6px}.queue{display:flex;gap:10px;margin:13px 0;overflow-x:auto;padding-bottom:5px}.thumb{position:relative;min-width:76px;width:76px;height:94px;background:#e8eee4;border-radius:10px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;bottom:0;left:0;right:0;background:#153b2bbb;color:white;font-size:11px;padding:4px;text-align:center}.batch-item{margin:16px 0;padding:17px;background:white;border:1px solid #dde6d6;border-radius:16px}.batch-item .field{margin:10px 0}.batch-head{display:flex;align-items:center;gap:10px}.batch-head b{flex:1}.batch-item img{width:55px;height:70px;object-fit:cover;border-radius:7px}.batch-item summary{font-size:13px;color:#5c765f;cursor:pointer;margin-top:15px}.batch-item pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:170px;overflow:auto}.date-row{display:grid;grid-template-columns:1.3fr .85fr .85fr;gap:8px}.date-row input,.date-row select{padding:10px 7px}.empty{text-align:center;padding:35px;color:#718272}.progress{background:#e4ebdf;height:6px;border-radius:20px;overflow:hidden;margin:16px 0}.progress span{display:block;height:100%;background:#387956;width:0;transition:width .3s}.sticky-title{display:flex;align-items:center;justify-content:space-between}.sticky-title button{font-size:13px}.success{padding:25px;text-align:center;color:#21633e}.hidden,[hidden]{display:none!important}@media(min-width:650px){header{padding-top:35px}.shell{padding:0 25px}}
</style></head><body>
<header><small>YUTAI · EXPIRY NOTE</small><h1>優待を登録</h1><p>会社と期限を、片手でさっと。</p></header>
<main class="shell"><div id="notice" role="status" aria-live="polite">期限データを読み込んでいます…</div>
<nav aria-label="登録方法"><button data-tab="manual" class="active">手入力</button><button data-tab="photos">画像から</button><button data-tab="records">修正する</button></nav>
<section id="manual"><div class="card"><div class="sticky-title"><h2 id="formTitle">新しい優待</h2><button class="btn light" id="reset">新規に戻す</button></div><p class="subtle">銘柄コードや管理用の情報は自動で補います。</p>
<form id="manualForm"><label class="field">会社・ブランド<input id="companySearch" autocomplete="off" placeholder="例：コメダ、すかいらーく"></label><div id="companyResults" class="results"></div><p id="chosenCompany" class="subtle"></p>
<label class="field">優待名<input id="benefit" required placeholder="例：株主優待食事券"></label><div class="field">有効期限<div id="manualDate" class="date-row"></div><p class="subtle">日が不明なら「日不明」。年は必ず確認してください。</p></div>
<label class="field">種類<select id="type"></select></label><label class="field">分類<select id="category"></select></label><label class="field">ひとことメモ<textarea id="notes" placeholder="申込は18時まで、必着、券の発行回など"></textarea></label>
<details><summary class="subtle">確認状態・発行回</summary><label class="field">確認状態<select id="status"><option value="confirmed">確認済み・掲載する</option><option value="checking">要確認・掲載しない</option></select></label><label class="field">対象発行回<input id="issue" placeholder="例：2026年6月権利分"></label></details></form></div></section>
<section id="photos" hidden><div class="card"><h2>画像をまとめて読み取る</h2><p class="subtle">優待券の写真やスクリーンショットを、一度に10枚まで。文字が小さいときは券の部分を切り抜くと読み取りやすくなります。</p>
<label class="photo-choice"><span class="icon">▧</span><strong>画像をまとめて選ぶ</strong><span class="subtle">写真ライブラリ・ファイルから選択</span><input id="photosInput" type="file" accept="image/*" multiple></label>
<div id="queue" class="queue"></div><button id="readImages" class="btn" disabled>まとめて読み取る</button><div class="progress"><span id="progress"></span></div><p id="readingState" class="subtle">画像はGoogleで文字を読み取り、一時ファイルを削除します。</p></div>
<div id="batchList"></div></section>
<section id="records" hidden><div class="card"><h2>登録済みの優待</h2><input id="recordSearch" placeholder="会社・優待名で検索" aria-label="登録済みを検索"><p class="subtle" id="count"></p><div id="recordList"></div></div></section>
<p id="sync" class="subtle"></p></main>
<footer class="bottom"><div class="bottom-inner"><button id="save" class="btn" disabled>シートに登録</button></div></footer>
<script>
const $=id=>document.getElementById(id),preview=!(window.google&&google.script&&google.script.run);
let model, tab='manual', company=null,editing=null,images=[],batch=[],busy=false,manualDirty=false;
function notice(t,error=false){$('notice').textContent=t;$('notice').className=error?'error':'';}
function rpc(method,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args));}
function key(t){return String(t||'').normalize('NFKC').toLowerCase().replace(/株式会社|ホールディングス|holdings|[\s・･.\-＆&（）()]/g,'').replace(/hd$/,'');}
function dateControls(parent,year='',month='',day=''){
 parent.replaceChildren();const y=document.createElement('input');y.type='number';y.inputMode='numeric';y.min=2000;y.max=2199;y.placeholder='年';y.value=year;y.setAttribute('aria-label','期限の年');y.dataset.part='year';
 const m=document.createElement('select'),d=document.createElement('select');m.dataset.part='month';d.dataset.part='day';m.setAttribute('aria-label','期限の月');d.setAttribute('aria-label','期限の日');m.add(new Option('月',''));for(let i=1;i<=12;i++)m.add(new Option(i+'月',i));d.add(new Option('日不明',''));for(let i=1;i<=31;i++)d.add(new Option(i+'日',i));m.value=month;d.value=day;parent.append(y,m,d);
}
function readDate(parent){const y=parent.querySelector('[data-part=year]').value,m=parent.querySelector('[data-part=month]').value,d=parent.querySelector('[data-part=day]').value;if(!/^20\d{2}$|^21\d{2}$/.test(y)||!m)throw Error('期限の年と月を入力してください。');const ym=y+'-'+String(m).padStart(2,'0'),date=d?ym+'-'+String(d).padStart(2,'0'):'';if(date&&new Date(date+'T00:00:00Z').toISOString().slice(0,10)!==date)throw Error('存在する日付を選んでください。');return {research_year:y,research_month_number:m,expiry_date:date};}
function companyMatches(q){const s=key(q);if(!s)return[];return model.companies.filter(c=>[c.company_name,c.code,...c.aliases].some(a=>key(a).includes(s))).slice(0,12);}
function companyOptions(parent,q,onChoose){parent.replaceChildren();for(const c of companyMatches(q)){const b=document.createElement('button');b.type='button';b.textContent=c.company_name;const small=document.createElement('small');small.textContent=c.code+(c.templates.length?' · 登録履歴あり':'');b.append(small);b.onclick=()=>{parent.replaceChildren();onChoose(c);};parent.append(b);}if(q&&!parent.childElementCount){const p=document.createElement('p');p.className='subtle';p.textContent='候補なし。正式な会社名でも検索してください。';parent.append(p);}}
function selectCompany(c,inherit=true){company=c;$('companySearch').value=c.company_name;$('chosenCompany').textContent=c.code+' '+c.company_name;if(inherit){const t=c.templates[0];$('benefit').value=t?.benefit_name||'';$('category').value=t?.category||'other';$('type').value=t?.expiry_type||'利用期限';}updateSave();}
function resetForm(){editing=null;company=null;$('manualForm').reset();$('chosenCompany').textContent='';$('companyResults').replaceChildren();$('formTitle').textContent='新しい優待';dateControls($('manualDate'));updateSave();}
function updateSave(){$('save').disabled=busy||!model||(tab==='manual'?!company:tab==='photos'?!batch.some(v=>!v.saved&&v.include):true);$('save').textContent=tab==='photos'?'選択した優待をまとめて登録':editing?'シートを更新':'シートに登録';}
function switchTab(next){if(busy)return;tab=next;for(const t of ['manual','photos','records'])$(t).hidden=t!==next;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===next));updateSave();}
function showSync(s){$('sync').textContent=!s.configured?'サイト自動反映：初期設定待ち':s.error?'シート保存済み・サイト反映エラー：'+s.error:s.pending?'サイト反映待ち。GitHubの更新後、サイトの生成が始まります。':s.lastSent?'GitHubへの最終送信：'+new Date(s.lastSent).toLocaleString('ja-JP')+'（サイト公開はActions完了後）':'サイトへの自動反映が有効です。';}
function editRecord(r){resetForm();editing=r;selectCompany(model.companies.find(c=>c.code===r.code),false);$('benefit').value=r.benefit_name;$('type').value=r.expiry_type;$('category').value=r.category;$('notes').value=r.notes;$('status').value=r.status==='secondary'?'checking':r.status;$('issue').value=r.issue;dateControls($('manualDate'),r.research_year,r.research_month_number,r.expiry_date?.slice(-2)||'');$('formTitle').textContent='優待を修正';switchTab('manual');scrollTo({top:0,behavior:'smooth'});}
function renderRecords(){const q=key($('recordSearch').value),rows=model.ledger.rows.filter(r=>!q||key(r.company_name+' '+r.code+' '+r.benefit_name).includes(q)).sort((a,b)=>(b.expiry_date||b.research_month).localeCompare(a.expiry_date||a.research_month));$('count').textContent=rows.length+'件';$('recordList').replaceChildren();for(const r of rows.slice(0,100)){const b=document.createElement('button');b.className='record';b.textContent=r.company_name+' · '+r.benefit_name;const s=document.createElement('small');s.textContent=(r.expiry_date||r.research_month+'（日不明）')+' ／ '+r.expiry_type;b.append(s);b.onclick=()=>editRecord(r);$('recordList').append(b);}}
async function compress(file){const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();if(img.width*img.height>60000000)throw Error('画像が大きすぎます。券の部分を切り抜いてください。');const canvas=document.createElement('canvas'),ratio=Math.min(1,2000/Math.max(img.width,img.height));canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.86);if(data.length>2600000)data=canvas.toDataURL('image/jpeg',.65);if(data.length>2600000)throw Error('画像を2MB以内にできませんでした。切り抜いてから再選択してください。');return data;}finally{URL.revokeObjectURL(url);}}
function renderQueue(){$('queue').replaceChildren();images.forEach((v,i)=>{const div=document.createElement('div');div.className='thumb';const img=document.createElement('img');img.src=v.data;img.alt='選択画像'+(i+1);const s=document.createElement('span');s.textContent=v.state||'待機中';div.append(img,s);$('queue').append(div);});}
function inputField(parent,title,value,onChange){const label=document.createElement('label');label.className='field';label.append(document.createTextNode(title));const input=document.createElement('input');input.value=value||'';input.oninput=()=>onChange(input.value);label.append(input);parent.append(label);return input;}
function renderBatch(){const list=$('batchList');list.replaceChildren();batch.forEach((v,i)=>{const box=document.createElement('article');box.className='batch-item';const head=document.createElement('div');head.className='batch-head';const check=document.createElement('input');check.type='checkbox';check.checked=v.include;check.disabled=v.saved;check.setAttribute('aria-label','画像'+(i+1)+'を登録対象にする');check.onchange=()=>{v.include=check.checked;updateSave();};const title=document.createElement('b');title.textContent=v.saved?'登録済み':'画像 '+(i+1);const tag=document.createElement('span');tag.className='tag'+(v.error||!v.company||!v.date?.research_year?' warn':'');tag.textContent=v.error?'読取失敗・手入力可':v.saved?'完了':v.company&&v.date?.research_year?'内容を確認':'要確認';head.append(check,title,tag);if(v.image){const img=document.createElement('img');img.src=v.image;img.alt='読み取り元の優待券';img.onclick=()=>{const w=window.open();if(w){const i=w.document.createElement('img');i.src=v.image;i.style.maxWidth='100%';w.document.body.append(i);}};head.append(img);}box.append(head);
 if(v.conflict){const p=document.createElement('p');p.className='subtle';p.textContent=v.conflict.kind==='existing'?'同じ記録が登録済みです。追加対象から外すか、登録済みの記録を修正してください。':'今回の画像'+(v.conflict.otherIndex+1)+'と同じ記録です。片方だけ登録してください。';box.append(p);if(v.conflict.record){const b=document.createElement('button');b.className='btn light';b.textContent='登録済みの記録を修正';b.onclick=()=>editRecord(v.conflict.record);box.append(b);}}
 if(v.error){const p=document.createElement('p');p.className='subtle';p.textContent=v.error;box.append(p);}if(v.warning){const p=document.createElement('p');p.textContent=v.warning;box.append(p);}
 const results=document.createElement('div');results.className='results';const field=inputField(box,'会社・ブランド',v.company?.company_name||'',q=>{v.company=null;companyOptions(results,q,c=>{v.company=c;field.value=c.company_name;v.benefit=v.benefit||c.templates[0]?.benefit_name||'';renderBatch();});});box.append(results);
 if(v.candidates?.length>1&&!v.company){for(const candidate of v.candidates){const b=document.createElement('button');b.type='button';b.className='btn light';b.textContent=candidate.company_name;b.onclick=()=>{v.company=model.companies.find(c=>c.code===candidate.code);v.benefit=v.benefit||v.company.templates[0]?.benefit_name||'';renderBatch();};box.append(b);}}
 inputField(box,'優待名',v.benefit||'',value=>v.benefit=value);const date=document.createElement('div');date.className='date-row';dateControls(date,v.date?.research_year||'',v.date?.research_month_number||'',v.date?.expiry_date?.slice(-2)||'');date.onchange=()=>{try{v.date=readDate(date);}catch{v.date=null;}};box.append(date);
 if(v.dates?.length>1){const s=document.createElement('select');s.add(new Option('印字された日付の候補',''));v.dates.forEach(d=>s.add(new Option(d.date+' · '+d.context.slice(0,40),d.date)));s.onchange=()=>{if(s.value){v.date={research_year:s.value.slice(0,4),research_month_number:String(Number(s.value.slice(5,7))),expiry_date:s.value};renderBatch();}};box.append(s);}
 const select=document.createElement('select');for(const type of model.ledger.types)select.add(new Option(type,type));select.value=v.type||v.company?.templates[0]?.expiry_type||'利用期限';v.type=select.value;select.onchange=()=>v.type=select.value;box.append(select);
 const category=document.createElement('select');for(const [value,label] of Object.entries(model.ledger.categories))category.add(new Option(label,value));category.value=v.category||v.company?.templates[0]?.category||'other';v.category=category.value;category.onchange=()=>v.category=category.value;box.append(category);
 const details=document.createElement('details'),summary=document.createElement('summary'),text=document.createElement('pre');summary.textContent='読み取った文字を確認';text.textContent=v.text||'読み取りなし';details.append(summary,text);box.append(details);if(v.saved)box.querySelectorAll('input,select').forEach(e=>e.disabled=true);list.append(box);});updateSave();}
function recordInput(c,benefit,date,type,category,notes='',issue='',status='confirmed'){if(!c)throw Error('会社を候補から選んでください。');if(!benefit.trim())throw Error('優待名を入力してください。');const t=c.templates.find(t=>t.benefit_name===benefit)||{};return {code:c.code,benefit_name:benefit,...date,expiry_type:type,category,notes,issue,status,verification_method:'user',checked_on:model.ledger.today,brands:t.brands||'',emoji:t.emoji||'',issuer_id:c.issuer_id||'',search_brand:''};}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('companySearch').oninput=()=>{company=null;companyOptions($('companyResults'),$('companySearch').value,selectCompany);updateSave();};$('reset').onclick=resetForm;$('recordSearch').oninput=renderRecords;
$('photosInput').onchange=async event=>{if(busy)return;const files=[...event.target.files];if(!files.length)return;if(files.length>10){notice('一度に選べる画像は10枚までです。',true);return;}if(batch.some(v=>!v.saved)&&!confirm('登録していない読み取り結果があります。新しい画像に入れ替えますか？'))return;busy=true;updateSave();images=[];batch=[];try{for(const file of files)images.push({data:await compress(file),state:'待機中'});renderQueue();renderBatch();$('readImages').disabled=preview;notice(preview?'これは設計プレビューです。実画像の読取・保存は接続後に有効になります。':files.length+'枚を選びました。');}catch(e){notice(e.message,true);}finally{busy=false;updateSave();}};
$('readImages').onclick=async()=>{if(busy)return;busy=true;updateSave();$('readImages').disabled=true;batch=[];let completed=0;for(let i=0;i<images.length;i++){const img=images[i];img.state='読取中';renderQueue();$('readingState').textContent=(i+1)+' / '+images.length+'枚を読み取っています。この画面を開いたままお待ちください。';try{const r=await rpc('recognizeCoupon',{mime:'image/jpeg',base64:img.data.split(',')[1]});const c=model.companies.find(c=>c.code===r.code);const d=r.expiry_date;batch.push({include:true,image:img.data,company:c,benefit:r.benefit_name||c?.templates[0]?.benefit_name||'',date:d?{research_year:d.slice(0,4),research_month_number:String(Number(d.slice(5,7))),expiry_date:d}:null,text:r.text,candidates:r.companies,dates:r.dates,warning:r.warning});img.state='読取済み';}catch(e){batch.push({include:true,image:img.data,error:e.message||String(e)});img.state='要確認';}completed++;$('progress').style.width=completed/images.length*100+'%';renderQueue();renderBatch();}busy=false;updateSave();$('readingState').textContent='読み取り完了。会社・優待名・期限を確認して、下のボタンでまとめて登録してください。';notice('読み取り結果を確認してください。まだシートには登録していません。');};
$('save').onclick=async()=>{if(preview){notice('設計プレビューのため保存はできません。',true);return;}if(busy)return;let entries=[];try{if(tab==='manual'){const r=recordInput(company,$('benefit').value,readDate($('manualDate')),$('type').value,$('category').value,$('notes').value,$('issue').value,$('status').value);if(editing)Object.assign(r,{id:editing.id,_version:editing._version,brands:editing.brands,emoji:editing.emoji,search_brand:editing.search_brand,source_url:editing.source_url,secondary_source_url:editing.secondary_source_url,verification_method:editing.verification_method});entries=[{input:r}];}else{entries=batch.filter(v=>v.include&&!v.saved).map(v=>({item:v,input:recordInput(v.company,v.benefit,v.date||{},v.type||'利用期限',v.category||'other')}));for(const e of entries)if(!e.input.research_year||!e.input.research_month_number)throw Error('選択した画像の年・月をすべて確認してください。');}}catch(e){notice(e.message,true);return;}busy=true;updateSave();let saved=0;try{const check=await rpc('checkMobileRecords',entries.map(e=>e.input));if(check.issues.length){for(const issue of check.issues){const e=entries[issue.index];if(e.item)e.item.conflict=issue;}if(tab==='photos')renderBatch();else if(check.issues[0].record){const r=check.issues[0].record;const b=document.createElement('button');b.className='btn light';b.textContent='登録済みの記録を修正する';b.onclick=()=>editRecord(r);$('companyResults').replaceChildren(b);}throw Error('重複する記録が見つかりました。まだ登録していません。既存の記録を修正するか、重複する画像を対象から外してください。');}for(const e of entries){const result=await rpc('saveMobileRecord',e.input);model.ledger=result.data;if(e.item)e.item.saved=true;saved++;showSync(await rpc('getExpirySyncStatus'));}renderRecords();if(tab==='photos'){batch=[];images=[];$('photosInput').value='';$('readImages').disabled=true;$('progress').style.width='0%';$('readingState').textContent='次の画像を選んでください。';renderQueue();renderBatch();}else resetForm();notice(saved+'件をシートに保存しました。');}catch(e){notice((saved?saved+'件は保存済みです。残りは未登録です。 ':'')+(e.message||String(e)),true);if(tab==='photos')renderBatch();}finally{busy=false;updateSave();}};
$('manualForm').onsubmit=e=>{e.preventDefault();$('save').click();};window.addEventListener('beforeunload',e=>{if(busy||batch.some(v=>v.include&&!v.saved)){e.preventDefault();e.returnValue='';}});
(async()=>{try{if(preview){model=window.MOBILE_PREVIEW_DATA;notice('設計プレビュー。会社検索・登録・修正の画面を確認できます。実データへの保存は無効です。');}else model=await rpc('getMobileData');for(const t of model.ledger.types)$('type').add(new Option(t,t));for(const[k,v]of Object.entries(model.ledger.categories))$('category').add(new Option(v,k));resetForm();renderRecords();showSync(model.sync);if(!preview)notice('会社名で検索するか、画像をまとめて選んでください。');}catch(e){notice('読み込みに失敗しました：'+e.message,true);}})();
</script></body></html>
