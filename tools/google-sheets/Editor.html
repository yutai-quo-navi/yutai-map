<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>優待期限の編集</title>
<style>
:root{font-family:system-ui,sans-serif;color:#193028;background:#f3f6f3;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#164d3e;color:white;padding:20px 28px}header h1{margin:0 0 5px;font-size:23px}header p{margin:0;color:#d5e5dd}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:18px 28px;background:white;border-bottom:1px solid #dbe3dc}input,select,textarea,button{font:inherit;padding:9px 11px;border:1px solid #bdcdc2;border-radius:7px}button{cursor:pointer;background:white;color:#193028}button.primary{background:#17624b;color:white;border-color:#17624b}button:disabled{opacity:.45;cursor:default}#search{flex:1;min-width:200px}main{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;padding:20px 28px}.panel{background:white;border:1px solid #dbe3dc;border-radius:12px;padding:18px}h2{font-size:18px;margin:0 0 15px}.list{max-height:520px;overflow:auto}.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e6ece7;border-radius:0;padding:14px 6px}.item:hover,.item.active{background:#edf5ef}.company{font-weight:700;font-size:15px}.meta{color:#60746a;font-size:12px;margin-top:5px}.date{float:right;color:#23634c;font-weight:700}.badge{display:inline-block;background:#edf2ef;padding:2px 6px;border-radius:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;color:#496054}label input,label select,label textarea{display:block;width:100%;margin-top:5px;color:#193028;background:white}.wide{grid-column:1/-1}.hint{font-size:12px;color:#60746a;margin:9px 0}details{margin:15px 0}summary{cursor:pointer;color:#40604e;margin-bottom:12px}.actions{display:flex;gap:9px;align-items:center;margin-top:16px}#notice{margin:0;padding:0 28px;color:#386446;min-height:25px}#notice.error{color:#b23232}#count{color:#60746a;font-size:12px}.preview{background:#fff2cd;padding:12px 28px;color:#68531c}dialog{border:1px solid #cbd8ce;border-radius:14px;width:680px;max-width:95vw;padding:24px}dialog::backdrop{background:#19302866}dialog textarea{width:100%;height:360px;line-height:1.7;margin:12px 0;resize:vertical}.empty{color:#60746a;padding:30px 0}@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}.toolbar{padding:12px}header{padding:18px}.list{max-height:300px}}
</style></head><body>
<header><h1>優待期限の編集</h1><p>年ごとの記録を残しながら、追加・訂正・X原稿の作成</p></header>
<div id="preview" class="preview" hidden>接続前のプレビューです。保存はできません。既存70件の検索・入力画面・X原稿を確認できます。</div>
<div class="toolbar"><input id="search" placeholder="証券コード・会社名・優待名で検索" aria-label="検索"><input id="month" type="month" aria-label="期限年月"><button id="all">全期間</button><button id="reload">再読み込み</button><button id="add" class="primary">＋ 優待を追加</button><button id="x">X原稿</button><button id="csv">CSVを保存</button></div>
<p id="notice" role="status"></p>
<main><section class="panel"><h2>期限の記録 <span id="count"></span></h2><div id="list" class="list"></div></section>
<section class="panel"><h2 id="formTitle">優待を追加</h2><form id="form"><div class="grid">
<label>証券コード<input name="code" required maxlength="4" placeholder="例：9672"></label><label>会社名<input name="company_name" required></label>
<label class="wide">優待名称<input name="benefit_name" required></label>
<label>期限の年<input name="research_year" type="number" min="2000" max="2199" required></label><label>期限の月<select name="research_month_number"></select></label>
<label>期限日（不明なら空欄）<input name="expiry_date" type="date"></label><label>期限種別<select name="expiry_type"></select></label>
<label>カテゴリ<select name="category"></select></label><label>確認状態<select name="status"><option value="confirmed">確認済み・表示対象</option><option value="checking">要確認</option><option value="secondary">二次情報のみ</option></select></label>
<label class="wide">利用可能ブランド<input name="brands" placeholder="複数は | で区切る（例：鳥貴族|TORIKI BURGER）"></label>
<label class="wide">備考<textarea name="notes" rows="2" placeholder="必着・予約期限など、知っておきたい条件"></textarea></label></div>
<p class="hint">年・月は必須。月だけ分かる場合、日付を無理に月末へ補完しません。</p>
<details><summary>出典・発行回・店舗検索など</summary><div class="grid">
<label class="wide">公式URL<input name="source_url" type="url"></label><label class="wide">二次情報URL<input name="secondary_source_url" type="url"></label>
<label>最終確認日<input name="checked_on" type="date"></label><label>確認経路<select name="verification_method"><option value="user">ユーザー確認</option><option value="official">公式確認</option></select></label>
<label>対象発行回<input name="issue"></label><label>Xアイコン<input name="emoji"></label><label>店舗検索会社ID<input name="issuer_id"></label><label>検索ブランド<input name="search_brand"></label></div></details>
<p id="history" class="hint"></p><div class="actions"><button id="save" class="primary" type="submit">保存</button><button id="copy" type="button">新しい記録として複製</button></div></form></section></main>
<dialog id="draft"><h2>X投稿用の初稿</h2><p class="hint">指定月の確認済みデータを出力します。投稿前に文章を手直ししてください。</p><textarea id="draftText" aria-label="X原稿"></textarea><button id="clipboard" class="primary">コピー</button> <button id="closeDraft">閉じる</button></dialog>
<script>
let data={rows:[],categories:{dining:'外食・飲食系',shopping:'買物・割引系',leisure:'サービス・レジャー系',catalog:'カタログ・申込期限',other:'その他'},types:['利用期限','申込期限','登録期限','予約期限','ポイント失効','交換期限','受取期限']},selected=null;
const $=id=>document.getElementById(id),form=$('form'),preview=!(window.google&&google.script&&google.script.run);
function notify(message,error=false){$('notice').textContent=message;$('notice').className=error?'error':'';}
function rpc(method,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args);});}
function localDate(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function options(){form.elements.research_month_number.replaceChildren(...Array.from({length:12},(_,i)=>new Option((i+1)+'月',i+1)));form.elements.category.replaceChildren(...Object.entries(data.categories).map(([k,v])=>new Option(v,k)));form.elements.expiry_type.replaceChildren(...data.types.map(v=>new Option(v,v)));}
function newRecord(r=null){selected=r;form.reset();for(const [key,value] of Object.entries(r||{})){if(form.elements[key])form.elements[key].value=value;}if(!r){const month=$('month').value||data.today.slice(0,7);form.elements.research_year.value=month.slice(0,4);form.elements.research_month_number.value=Number(month.slice(5));form.elements.checked_on.value=data.today;} $('formTitle').textContent=r?'期限の記録を編集':'優待を追加';historyHint();render();}
function historyHint(){const next=form.elements.research_year.value;$('history').textContent=selected&&next!==selected.research_year?'年が変わるため、元の記録を残して新しい年の記録を追加します。':selected?'この記録を訂正します。翌年分を追加する場合は期限の年を変更してください。':'新しい記録を追加します。';}
function render(){const q=$('search').value.trim().toLowerCase(),month=$('month').value;const rows=data.rows.filter(r=>(!month||r.research_month===month)&&(!q||[r.code,r.company_name,r.benefit_name,r.brands].join(' ').toLowerCase().includes(q))).sort((a,b)=>(a.expiry_date||a.research_month+'-99').localeCompare(b.expiry_date||b.research_month+'-99')||a.code.localeCompare(b.code));$('count').textContent=rows.length+'件 / 全'+data.rows.length+'件';$('list').replaceChildren();for(const r of rows){const item=document.createElement('button');item.className='item'+(selected?.id===r.id?' active':'');const date=document.createElement('span');date.className='date';date.textContent=r.expiry_date?r.expiry_date.replaceAll('-','/') : r.research_month.replace('-','/')+'（日不明）';const company=document.createElement('div');company.className='company';company.textContent=r.code+' '+r.company_name;const benefit=document.createElement('div');benefit.textContent=r.benefit_name;const meta=document.createElement('div');meta.className='meta';meta.textContent=r.expiry_type+' · '+(data.categories[r.category]||r.category)+' · '+({confirmed:'確認済み',checking:'要確認',secondary:'二次情報のみ'}[r.status]||r.status);item.append(date,company,benefit,meta);item.onclick=()=>newRecord(r);$('list').append(item);}if(!rows.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='該当する記録はありません。';$('list').append(empty);}}
function makeDraft(month){const rows=data.rows.filter(r=>r.research_month===month&&r.status==='confirmed').sort((a,b)=>(a.expiry_date||a.research_month+'-99').localeCompare(b.expiry_date||b.research_month+'-99')||a.code.localeCompare(b.code));let lines=['⚠️'+month.replace('-','年')+'月 期限優待まとめ','','お持ちの方は期限をチェック👇'];for(const [category,title] of Object.entries(data.categories)){const group=rows.filter(r=>r.category===category);if(!group.length)continue;lines.push('','◇'+title);for(const r of group){const date=r.expiry_date?Number(r.expiry_date.slice(5,7))+'/'+Number(r.expiry_date.slice(8))+'まで':Number(month.slice(5))+'月（日付未記録）';lines.push((r.emoji||'・')+' '+r.code+' '+r.company_name+' '+r.benefit_name+'【'+date+'／'+r.expiry_type+'】');if(r.notes)lines.push('  ※'+r.notes);}}if(!rows.length)lines.push('','該当する確認済みデータはありません。');return lines.join('\n');}
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('search').oninput=render;$('month').onchange=render;$('all').onclick=()=>{$('month').value='';render();};$('add').onclick=()=>newRecord();form.elements.research_year.oninput=historyHint;
form.elements.expiry_date.onchange=()=>{const d=form.elements.expiry_date.value;if(d){form.elements.research_year.value=d.slice(0,4);form.elements.research_month_number.value=Number(d.slice(5,7));historyHint();}};
$('copy').onclick=()=>{selected=null;$('formTitle').textContent='複製を追加';form.elements.checked_on.value=data.today;historyHint();render();};
form.onsubmit=async e=>{e.preventDefault();if(preview)return;const input=Object.fromEntries(new FormData(form));if(selected){input.id=selected.id;input._version=selected._version;}$('save').disabled=true;try{const result=await rpc('saveRecord',input);data=result.data;newRecord(data.rows.find(r=>r.id===result.id));notify(result.keptPreviousYear?'前年の記録を残して、新しい年の記録を追加しました。':'保存しました。');}catch(e){notify(e.message||String(e),true);}finally{$('save').disabled=false;}};
$('reload').onclick=async()=>{if(preview)return;try{data=await rpc('getEditorData');newRecord();notify('最新データを読み込みました。');}catch(e){notify(e.message||String(e),true);}};
$('x').onclick=()=>{const month=$('month').value;if(!month){notify('X原稿の対象年月を選択してください。',true);return;}$('draftText').value=makeDraft(month);$('draft').showModal();};$('closeDraft').onclick=()=>$('draft').close();$('clipboard').onclick=async()=>{try{await navigator.clipboard.writeText($('draftText').value);notify('原稿をコピーしました。');}catch{ $('draftText').select();document.execCommand('copy');}};
$('csv').onclick=async()=>{try{download(await rpc('exportMasterCsv'),'expiry_master.csv');notify('元データ用のCSVを保存しました。');}catch(e){notify(e.message||String(e),true);}};
(async()=>{try{if(preview){data={...data,rows:window.EXPIRY_PREVIEW_ROWS||[],today:localDate()};$('preview').hidden=false;for(const id of ['save','csv','reload'])$(id).disabled=true;}else data=await rpc('getEditorData');options();$('month').value=data.today.slice(0,7);newRecord();}catch(e){notify(e.message||String(e),true);}})();
</script></body></html>
