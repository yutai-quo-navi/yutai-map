name = "yutai-map-api"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "yutai-map"
database_id = "4540cbaa-3214-4111-9c7a-11e18fd067db"

[vars]
ALLOWED_ORIGIN = "https://yutai-quo-navi.github.io"

[[ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 60
period = 60

[[durable_objects.bindings]]
name = "SEARCH_COUNTER"
class_name = "SearchCounter"

[[migrations]]
tag = "search-counter-v1"
new_sqlite_classes = ["SearchCounter"]
