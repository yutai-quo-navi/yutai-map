name: Build Colowide store DB

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/scrape_colowide.py"
      - ".github/workflows/scrape_colowide.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python tools/scrape_colowide.py
      - name: Commit generated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/colowide_stores.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate Colowide eligible store database"
          git push
