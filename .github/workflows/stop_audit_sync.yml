name: Stop audit branch store syncs

on:
  push:
    branches:
      - security/pin-wrangler-20261008
    paths:
      - .github/workflows/stop_audit_sync.yml

permissions:
  contents: read

concurrency:
  group: official-store-db
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Stopped unintended audit-branch syncs. No database operations.'
