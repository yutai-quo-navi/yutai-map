name: Deploy Cloudflare Worker API

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker/**"
      - "cloudflare/wrangler.toml"
      - ".github/workflows/deploy_cloudflare_worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify API security guards before deployment
        run: node --test tests/worker-security.test.mjs tests/feature-api.test.mjs

      - name: Prepare Cloudflare API token
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CF_API_TOKEN }}
        run: |
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CF_API_TOKEN" || { echo "CF_API_TOKEN is not configured"; exit 1; }
          echo "::add-mask::$CF_API_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CF_API_TOKEN" >> "$GITHUB_ENV"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Deploy Worker
        run: npx wrangler deploy --config cloudflare/wrangler.toml

      - name: Verify Worker health
        run: |
          for attempt in 1 2 3 4 5; do
            BODY="$(curl -fsS https://yutai-map-api.yutaisamurai.workers.dev/health || true)"
            echo "$BODY"
            if printf '%s' "$BODY" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") is True and int(d.get("stores",0)) > 0 and int(d.get("referenceStores",0)) > 0 else 1)'; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "Worker health check failed"
              exit 1
            fi
            sleep 2
          done

      - name: Verify Colowide Worker search
        run: |
          BODY="$(curl -fsS 'https://yutai-map-api.yutaisamurai.workers.dev/v1/stores/search?lat=35.6812&lng=139.7671&radius=10000&issuers=colowide')"
          echo "$BODY"
          printf '%s' "$BODY" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if int(d.get("count",0)) > 0 else 1)'
