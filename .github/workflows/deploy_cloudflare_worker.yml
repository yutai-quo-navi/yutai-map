name: Deploy Cloudflare Worker API

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker/**"
      - "cloudflare/wrangler.toml"
      - "cloudflare/migrations/**"
      - ".github/workflows/deploy_cloudflare_worker.yml"
      - "tools/apply_d1_migrations.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Verify API security guards before deployment
        run: node --test tests/worker-security.test.mjs tests/feature-api.test.mjs tests/reference-matching.test.mjs tests/d1-efficiency.test.mjs tests/store-pagination.test.mjs

      - name: Verify D1 migrations and update pagination
        run: |
          if find tests -type f -name 'test_d1_*.py' -print -quit | grep -q .; then
            python -m unittest discover -s tests -p 'test_d1_*.py'
          else
            echo "No D1 migration tests present; skipping empty unittest discovery."
          fi

      - name: Install locked Wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare Cloudflare API token
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CF_API_TOKEN }}
        run: |
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CF_API_TOKEN" || { echo "CF_API_TOKEN is not configured"; exit 1; }
          echo "::add-mask::$CF_API_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CF_API_TOKEN" >> "$GITHUB_ENV"

      - name: Apply additive D1 migrations before Worker rollout
        run: python tools/apply_d1_migrations.py

      - name: Deploy Worker
        run: npx wrangler deploy --config cloudflare/wrangler.toml

      - name: Verify Worker health
        run: |
          for attempt in 1 2 3 4 5; do
            BODY="$(curl -fsS --max-time 20 https://yutai-map-api.yutaisamurai.workers.dev/health || true)"
            echo "$BODY"
            if printf '%s' "$BODY" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") is True and int(d.get("stores",0)) > 0 and int(d.get("referenceStores",0)) >= 0 else 1)'; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "Worker health check failed"
              exit 1
            fi
            sleep 2
          done

      - name: Verify real 44-issuer search at Tokyo Station
        run: |
          IDS='skylark,colowide,create,zensho,toridoll,foodlife,yoshinoya,mcd,monogatari,matsuya,royal,balnibarbi,daiichikosho,fujio,srs,arclands,kineya,saintmarc,chimney,ringerhut,hiday,ichibanya,komeda,dnh,mos,yamaokaya,chikaranomoto,ohsho,joyfull,yossix,kura,genki,amiyaki,towa,hikari,gift,hotland,eternal,kourakuen,bronco,tenallied,kisoji,tenpos,anrakutei'
          HTTP_STATUS=$(curl --silent --show-error --max-time 45 --output /tmp/yutai-wide-response.json --write-out '%{http_code}' --get 'https://yutai-map-api.yutaisamurai.workers.dev/v1/stores/search' --data-urlencode 'lat=35.6812' --data-urlencode 'lng=139.7671' --data-urlencode 'radius=30000' --data-urlencode "issuers=$IDS")
          echo "44-company HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != 200 ]; then
            python -c 'import json;d=json.load(open("/tmp/yutai-wide-response.json"));print("Server error:",d.get("error","unknown"))'
            exit 1
          fi
          python -c 'import json;d=json.load(open("/tmp/yutai-wide-response.json")); print("Stores:",d.get("count"),"Incomplete:",d.get("incomplete"),"Coverage:",d.get("coverage")); assert int(d.get("count",0))>0,"44-company search returned no stores"; assert isinstance(d.get("results"),list) and len(d["results"])==d["count"]; assert d["coverage"]["external_requests"]==0; assert d["incomplete"] is (not d["coverage"]["complete"])'

      - name: Verify precomputed brand catalog
        run: |
          BODY="$(curl -fsS --max-time 20 'https://yutai-map-api.yutaisamurai.workers.dev/v1/brands?issuers=colowide,ringerhut,saintmarc,chimney')"
          printf '%s' "$BODY" | python -c 'import json,sys; d=json.load(sys.stdin); rows=d.get("brands",[]); assert rows and all(int(r["count"]) > 0 for r in rows); assert {r["issuer_id"] for r in rows} == {"colowide","ringerhut","saintmarc","chimney"}; print("Brand catalog verified:",len(rows),"brands")'
