name: Deploy Cloudflare Worker API

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker/**"
      - "cloudflare/wrangler.toml"
      - "tools/verify_worker.py"
      - ".github/workflows/deploy_cloudflare_worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify API security guards before deployment
        run: node --test tests/worker-security.test.mjs tests/feature-api.test.mjs

      - name: Prepare Cloudflare API token
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CF_API_TOKEN }}
        run: |
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CF_API_TOKEN" || { echo "CF_API_TOKEN is not configured"; exit 1; }
          echo "::add-mask::$CF_API_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CF_API_TOKEN" >> "$GITHUB_ENV"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Deploy Worker
        run: npx wrangler deploy --config cloudflare/wrangler.toml

      - name: Verify public API or country denial and authenticated D1
        run: |
          python tools/verify_worker.py
          python tools/verify_worker.py --issuer colowide
