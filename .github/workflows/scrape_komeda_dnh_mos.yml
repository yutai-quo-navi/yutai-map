name: Build Komeda Doutor MOS official store DBs
on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 2 * *'
  push:
    branches: [main]
    paths:
      - 'tools/issuers/official_api.py'
      - 'tools/issuers/komeda/**'
      - 'tools/issuers/dnh/**'
      - 'tools/issuers/mos/**'
      - 'tests/test_official_apis.py'
      - '.github/workflows/scrape_komeda_dnh_mos.yml'
permissions:
  contents: write
concurrency:
  group: official-store-db
  cancel-in-progress: false
jobs:
  scrape:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[migration]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify official parsers and incremental sync
        run: python -m unittest discover -s tests -p 'test_official_apis.py'
      - name: Install locked Wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Cloudflare API token
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CF_API_TOKEN }}
        run: |
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CF_API_TOKEN"
          echo "::add-mask::$CF_API_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CF_API_TOKEN" >> "$GITHUB_ENV"
      - name: Restore, collect and sync only issuer deltas
        run: |
          for issuer in komeda dnh mos; do
            python tools/restore_d1_issuer.py "$issuer"
            python "tools/issuers/$issuer/scrape.py"
            python tools/build_d1_issuer_sql.py "$issuer"
            python tools/sync_d1_issuer.py "$issuer"
          done
      - name: Enable official search after successful imports
        run: python tools/issuers/promote_official.py
      - name: Merge public update history
        run: |
          python tools/build_updates.py
          rm -rf data/issuers/komeda/stores data/issuers/dnh/stores data/issuers/mos/stores
      - name: Commit public update metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/updates.json data/issuers/komeda/config.json data/issuers/dnh/config.json data/issuers/mos/config.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Komeda Doutor MOS official store changes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
