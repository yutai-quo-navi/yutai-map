name: Probe Zensho official store source

on:
  push:
    branches:
      - main
    paths:
      - "tools/issuers/zensho/probe.py"
      - ".github/workflows/probe_zensho.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.14"
      - name: Probe official site
        run: python tools/issuers/zensho/probe.py
