name: Temporary one-time logo localization
on:
  push:
    paths:
      - '.github/workflows/localize-selection-logos-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  save-logo-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image encoders
        run: python -m pip install --quiet pillow cairosvg requests
      - name: Preserve external logo files as local optimized assets
        shell: bash
        run: |
          python - <<'PY'
          import io, os, time, urllib.parse
          import requests, cairosvg
          from PIL import Image
          base='https://commons.wikimedia.org/wiki/Special:FilePath/'
          logos={
            'skylark':('commons','Gusto Logo.svg'),
            'zensho':('commons','Sukiya logo.svg'),
            'toridoll':('commons','Marugame Seimen logo.svg'),
            'yoshinoya':('commons','Yoshinoya Logo.svg'),
            'komeda':('commons',"Komeda's Coffee Shop logo.svg"),
            'dnh':('commons','Doutor Coffee Logo.png'),
            'mos':('commons','MOS-Burger-Logo.svg'),
            'chikaranomoto':('commons','Ippudo Logo.png'),
            'ohsho':('commons','餃子の王将.svg'),
            'joyfull':('commons','Joyfull Restaurant.png'),
            'colowide':('url','https://livedoor.blogimg.jp/line_jp/imgs/2/9/29dbd189.png'),
            'sunfrontier-hotels':('url','https://foodslabo-app-prod.s3.ap-northeast-1.amazonaws.com/store/uploads/brands/4170/original-brand/4170/logo/cfb27bdb4b70a7ec720f70d1fd03bb5b.png'),
          }
          os.makedirs('assets',exist_ok=True)
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; YutaiLogoLocalization/1.0)','Accept':'image/avif,image/webp,image/svg+xml,image/png,image/*;q=0.8'})
          errors=[]
          for key,(kind,location) in logos.items():
            url=base+urllib.parse.quote(location,safe='') if kind=='commons' else location
            try:
              response=session.get(url,timeout=35)
              response.raise_for_status()
              raw=response.content
              if raw.lstrip().startswith(b'<svg') or b'<svg' in raw[:2000]:
                raw=cairosvg.svg2png(bytestring=raw,output_width=680)
              im=Image.open(io.BytesIO(raw))
              im.load()
              im=im.convert('RGBA')
              im.thumbnail((640,350),Image.Resampling.LANCZOS)
              path=f'assets/logo-local-{key}.webp'
              im.save(path,format='WEBP',quality=90,method=6)
              print(key, im.size, len(raw), os.stat(path).st_size, response.url,flush=True)
            except Exception as exc:
              errors.append((key,str(exc)))
              print('FAILED',key,url,str(exc),flush=True)
          if errors:
            raise RuntimeError('Missing logo assets: '+repr(errors))
          PY
      - name: Save images to same GitHub Pages repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo-local-*.webp
          git diff --cached --quiet || git commit -m "Store external brand artwork as optimized local GitHub Pages assets"
          git pull --rebase origin main
          git push origin HEAD:main
