name: Check interface quality
on:
  workflow_dispatch:
  pull_request:
    paths: ['index.html', '*.css', '*.js', 'assets/brand.css', 'ui-policy.json', 'tools/check_ui.mjs', 'package*.json', '.github/workflows/ui-quality.yml']
  push:
    branches: [main]
    paths: ['index.html', '*.css', '*.js', 'assets/brand.css', 'ui-policy.json', 'tools/check_ui.mjs', 'tests/**', 'package*.json', '.github/workflows/ui-quality.yml']
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Findings are reviewable reports during the initial lintapple rollout.
      # Functional assertions and browser failures still fail this job.
      - run: npm run lint:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-quality-report
          path: ui-reports/
          retention-days: 14
