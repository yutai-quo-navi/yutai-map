name: Check Cloudflare D1 store DB

on:
  workflow_dispatch:
  push:
    branches:
      - security/pin-wrangler-20261008

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.14"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install locked Wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare Cloudflare API token
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CF_API_TOKEN }}
        run: |
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CF_API_TOKEN" || { echo "CF_API_TOKEN is not configured"; exit 1; }
          echo "::add-mask::$CF_API_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CF_API_TOKEN" >> "$GITHUB_ENV"

      - name: Read D1 state
        run: |
          npx wrangler d1 execute "4540cbaa-3214-4111-9c7a-11e18fd067db" --remote --command "
            SELECT s.issuer_id,
                   COALESCE(g.c,0)+COALESCE(r.c,0) AS store_count,
                   COALESCE(raw.c,0) AS raw_count,
                   s.updated_at
            FROM issuer_state s
            LEFT JOIN (SELECT issuer_id,COUNT(*) c FROM stores GROUP BY issuer_id) g ON g.issuer_id=s.issuer_id
            LEFT JOIN (SELECT issuer_id,COUNT(*) c FROM reference_stores GROUP BY issuer_id) r ON r.issuer_id=s.issuer_id
            LEFT JOIN (SELECT issuer_id,COUNT(*) c FROM store_raw GROUP BY issuer_id) raw ON raw.issuer_id=s.issuer_id
            ORDER BY s.issuer_id;
          " --json > /tmp/d1-health.json

      - name: Validate D1 state
        run: python tools/check_d1_health.py /tmp/d1-health.json

      - name: Verify Worker
        run: curl -fsS https://yutai-map-api.yutaisamurai.workers.dev/health
