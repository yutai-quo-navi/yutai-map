name: Inspect official Yoshinoya search
on:
  push:
    paths: [".github/workflows/inspect_yoshinoya.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify official default conditions
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re,json
          root='https://stores.yoshinoya-holdings.com/yoshinoya-holdings'
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=60).read().decode('utf-8','replace')
          h=get(root+'/spot/list?c_d1=1')
          for needle in ['function addCategoryDefaultCondition','var param =','c_d1','c_d9','searchSpots(param','searchSpots(params','searchSpots(']:
              hits=[m.start() for m in re.finditer(re.escape(needle),h)]
              for n in hits[-3:]:
                  print('CONTEXT',needle,h[max(0,n-300):n+1800])
          PY
