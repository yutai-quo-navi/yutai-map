name: Inspect official Yoshinoya search
on:
  push:
    paths: [".github/workflows/inspect_yoshinoya.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official page and search scripts
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re
          url='https://stores.yoshinoya-holdings.com/yoshinoya-holdings/spot/list?c_d1=1'
          def get(u):
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              return urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
          html=get(url)
          for line in html.splitlines():
              if any(s in line.lower() for s in ['<script','c_d1','api','navi','spot/list','spot/search']):
                  print(line[:1200])
          sources=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',html)
          for src in sources:
              u=urllib.parse.urljoin(url,src)
              if not any(s in u for s in ['navitime','yoshinoya']): continue
              print('SCRIPT',u)
              js=get(u)
              for line in js.splitlines():
                  if any(s in line for s in ['.json','api/','c_d1','ajax','page','/spot/','fetch(','limit','offset']):
                      print(line[:12000])
          PY
