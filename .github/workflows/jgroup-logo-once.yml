name: Materialize official J-Group logo locally (one-time feature-branch tool)
on:
  push:
    branches: [feature/jgroup-3063-ui]
    paths: [.github/workflows/jgroup-logo-once.yml]
permissions:
  contents: write
jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14
      - run: python -m pip install pillow==11.3.0
      - name: Copy legitimate official J-Group recruitment logo into public assets
        run: |
          python - <<'PY'
          import io,urllib.request
          from PIL import Image
          from pathlib import Path
          url='https://static.wixstatic.com/media/24eaf4_39e1bbf0b95e497b980184592fe494d8~mv2.jpg'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'image/*'})
          with urllib.request.urlopen(req,timeout=30) as res:
              data=res.read(500_000)
              if not res.headers.get('Content-Type','').startswith('image/'):raise ValueError('Official image unavailable')
          image=Image.open(io.BytesIO(data)).convert('RGB')
          image.thumbnail((220,220))
          if image.width<100 or image.height<100:raise ValueError('Unexpected official logo dimensions')
          path=Path('assets/logo-jgroup.webp')
          image.save(path,format='WEBP',quality=86,method=6)
          print('Stored official logo',image.size,path.stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/logo-jgroup.webp
          git diff --cached --quiet || git commit -m "Store official J-Group logo locally"
          git push origin HEAD:refs/heads/feature/jgroup-3063-ui
