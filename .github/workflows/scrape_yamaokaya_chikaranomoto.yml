name: Build Yamaokaya Ippudo official store DBs
on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 3 * *'
  push:
    branches: [main]
    paths:
      - 'tools/issuers/ramen_official.py'
      - 'tools/issuers/yamaokaya/**'
      - 'tools/issuers/chikaranomoto/**'
      - 'tools/issuers/promote_ramen.py'
      - 'tests/test_ramen_official.py'
      - '.github/workflows/scrape_yamaokaya_chikaranomoto.yml'
permissions:
  contents: write
concurrency:
  group: official-store-db
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install locked official HTML parser
        run: python -m pip install --require-hashes -r tools/requirements-colowide.txt
      - name: Verify parsers and incremental sync
        run: |
          python -m unittest discover -s tests -p 'test_ramen_official.py'
          python -m unittest discover -s tests -p 'test_d1_efficiency.py'
      - name: Install locked Wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Cloudflare API token
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CF_API_TOKEN }}
        run: |
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CF_API_TOKEN"
          echo "::add-mask::$CF_API_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CF_API_TOKEN" >> "$GITHUB_ENV"
      - name: Restore, collect and sync only validated issuer deltas
        run: |
          for issuer in yamaokaya chikaranomoto; do
            python tools/restore_d1_issuer.py "$issuer"
            python "tools/issuers/$issuer/scrape.py"
            python tools/build_d1_issuer_sql.py "$issuer"
            python tools/sync_d1_issuer.py "$issuer"
          done
      - name: Verify D1 imports before publication
        run: |
          npx wrangler d1 execute 4540cbaa-3214-4111-9c7a-11e18fd067db --remote --json --command "SELECT issuer_id,geo_count,reference_count FROM issuer_stats WHERE issuer_id IN ('yamaokaya','chikaranomoto');" > /tmp/ramen-counts.json
          python tools/issuers/verify_ramen_d1.py /tmp/ramen-counts.json
      - name: Enable official search after both successful imports
        run: python tools/issuers/promote_ramen.py
      - name: Merge public update history
        run: |
          python tools/build_updates.py
          rm -rf data/issuers/yamaokaya/stores data/issuers/chikaranomoto/stores
      - name: Publish configurations and public update metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/updates.json data/issuers/index.json data/issuers/yamaokaya/config.json data/issuers/chikaranomoto/config.json
          if ! git diff --cached --quiet; then
            git commit -m 'Enable verified Yamaokaya and Ippudo official store search'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
