name: Update Balnibarbi feature stores

on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 1 * *'
  push:
    branches: [main]
    paths:
      - tools/features/scrape_balnibarbi.py
      - .github/workflows/scrape_balnibarbi_feature.yml

permissions:
  contents: read

concurrency:
  group: balnibarbi-feature-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Verify feature scraper
        run: python -m unittest discover -s tests -p 'test_balnibarbi_feature.py'
      - name: Prepare Cloudflare API token
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CF_API_TOKEN }}
        run: |
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CF_API_TOKEN" || { echo 'CF_API_TOKEN is not configured'; exit 1; }
          echo "::add-mask::$CF_API_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CF_API_TOKEN" >> "$GITHUB_ENV"
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Prepare feature table
        run: npx wrangler d1 execute '4540cbaa-3214-4111-9c7a-11e18fd067db' --remote --command 'CREATE TABLE IF NOT EXISTS feature_snapshots (feature_id TEXT PRIMARY KEY, payload_json TEXT NOT NULL, checked_on TEXT NOT NULL);'
      - name: Read previous count
        run: |
          npx wrangler d1 execute '4540cbaa-3214-4111-9c7a-11e18fd067db' --remote --command "SELECT json_array_length(payload_json,'$.stores') AS count FROM feature_snapshots WHERE feature_id='balnibarbi-dining';" --json > /tmp/feature-count.json
          python -c 'import json; d=json.load(open("/tmp/feature-count.json")); print("PREVIOUS_COUNT="+str(next((r["count"] for group in d for r in group.get("results",[])),0)))' >> "$GITHUB_ENV"
      - name: Scrape official eligible stores
        run: python tools/features/scrape_balnibarbi.py --previous-count "$PREVIOUS_COUNT"
      - name: Replace private snapshot after successful validation
        run: npx wrangler d1 execute '4540cbaa-3214-4111-9c7a-11e18fd067db' --remote --file=cloudflare/generated/sync_balnibarbi_feature.sql
