name: Build Ohsho Joyfull official store DBs
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 4 * *'
  push:
    branches: [main]
    paths:
      - 'tools/issuers/ohsho_joyfull.py'
      - 'tools/issuers/ohsho/**'
      - 'tools/issuers/joyfull/**'
      - 'tools/issuers/promote_ohsho_joyfull.py'
      - 'tests/test_ohsho_joyfull.py'
      - '.github/workflows/scrape_ohsho_joyfull.yml'
permissions:
  contents: write
concurrency:
  group: official-store-db
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install locked official HTML parser
        run: python -m pip install --require-hashes -r tools/requirements-colowide.txt
      - name: Verify parsers and incremental sync
        run: |
          python -m unittest discover -s tests -p 'test_ohsho_joyfull.py'
          python -m unittest discover -s tests -p 'test_d1_efficiency.py'
      - name: Install locked Wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Cloudflare API token
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CF_API_TOKEN }}
        run: |
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CF_API_TOKEN"
          echo "::add-mask::$CF_API_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CF_API_TOKEN" >> "$GITHUB_ENV"
      - name: Restore, collect and sync each issuer independently
        run: |
          synced=""
          for issuer in ohsho joyfull; do
            if python tools/restore_d1_issuer.py "$issuer" && python "tools/issuers/$issuer/scrape.py" && python tools/build_d1_issuer_sql.py "$issuer" && python tools/sync_d1_issuer.py "$issuer"; then
              synced="$synced $issuer"
            else
              echo "::warning::$issuer official source unavailable; existing search and data preserved"
              rm -rf "data/issuers/$issuer/stores"
            fi
          done
          test -n "$synced"
          printf '%s' "$synced" > cloudflare/generated/ohsho-joyfull-synced.txt
      - name: Verify D1 imports before publication
        run: |
          npx wrangler d1 execute 4540cbaa-3214-4111-9c7a-11e18fd067db --remote --json --command "SELECT issuer_id,geo_count,reference_count FROM issuer_stats WHERE issuer_id IN ('ohsho','joyfull');" > /tmp/ohsho-joyfull-counts.json
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/issuers')
          from verify_ohsho_joyfull_d1 import verify
          verify(json.loads(Path('/tmp/ohsho-joyfull-counts.json').read_text()), Path('cloudflare/generated/ohsho-joyfull-synced.txt').read_text().split())
          PY
      - name: Refresh public metadata before promotion
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          git pull --ff-only origin main
      - name: Enable official search only for successfully verified imports
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools/issuers')
          from promote_ohsho_joyfull import promote
          promote(Path('cloudflare/generated/ohsho-joyfull-synced.txt').read_text().split())
          PY
      - name: Merge public update history
        run: |
          python tools/build_updates.py
          rm -rf data/issuers/ohsho/stores data/issuers/joyfull/stores
      - name: Publish configurations and public update metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/updates.json data/issuers/index.json data/issuers/ohsho/config.json data/issuers/joyfull/config.json
          if ! git diff --cached --quiet; then
            git commit -m 'Enable verified Ohsho and Joyfull official store search'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
