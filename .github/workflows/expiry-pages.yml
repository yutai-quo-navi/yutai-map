name: Generate expiry SEO pages
on:
  schedule:
    - cron: '20 16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/expiry.json'
      - 'scripts/build-expiry-pages.mjs'
      - '.github/workflows/expiry-pages.yml'
permissions:
  contents: write
concurrency:
  group: expiry-seo-pages
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate static expiry pages
        run: node scripts/build-expiry-pages.mjs
      - name: Commit updated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/expiry sitemap.xml
          git diff --cached --quiet || (git commit -m "chore: refresh expiry SEO pages" && git push)
