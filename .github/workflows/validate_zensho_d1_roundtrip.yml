name: Validate Zensho D1 roundtrip

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate_zensho_d1_roundtrip.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-store-db
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.14"

      - name: Prepare Cloudflare API token
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CF_API_TOKEN }}
        run: |
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CF_API_TOKEN" || { echo "CF_API_TOKEN is not configured"; exit 1; }
          echo "::add-mask::$CF_API_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CF_API_TOKEN" >> "$GITHUB_ENV"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Restore previous Zensho state from D1
        run: |
          rm -f /tmp/raw_*.json /tmp/meta.json
          for offset in 0 500 1000 1500 2000 2500 3000 3500 4000 4500 5000; do
            npx wrangler d1 execute "4540cbaa-3214-4111-9c7a-11e18fd067db" --remote --command "SELECT raw_json FROM store_raw WHERE issuer_id='zensho' ORDER BY store_id LIMIT 500 OFFSET $offset;" --json > "/tmp/raw_${offset}.json"
          done
          npx wrangler d1 execute "4540cbaa-3214-4111-9c7a-11e18fd067db" --remote --command "SELECT current_meta_json FROM issuer_state WHERE issuer_id='zensho';" --json > /tmp/meta.json
          python tools/restore_d1_state.py zensho '/tmp/raw_*.json' /tmp/meta.json

      - name: Verify restored baseline
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/issuers/zensho/stores/current.json"))
          n=len(d.get("stores") or [])
          print("restored baseline:",n)
          assert n == 4693, n
          PY

      - name: Run second Zensho scrape
        run: python tools/issuers/zensho/scrape.py

      - name: Verify incremental diff
        run: |
          cat data/issuers/zensho/stores/last_diff.md
          python - <<'PY'
          import json,glob
          p=sorted(glob.glob("data/issuers/zensho/stores/diffs/*.json"))[-1]
          d=json.load(open(p))
          c=d["counts"]
          print("roundtrip diff:",c)
          assert c["previous"] == 4693, c
          assert c["current"] >= 4300, c
          # A real store may change between the two runs; the scraper's own
          # bulk-change guards are authoritative. This step checks that the
          # baseline was recognized rather than treating all rows as new.
          assert c["added"] < 250, c
          assert c["removed"] < 250, c
          assert c["changed"] < 600, c
          PY

      - name: Verify D1 is unchanged by validation
        run: |
          npx wrangler d1 execute "4540cbaa-3214-4111-9c7a-11e18fd067db" --remote --command "SELECT COUNT(*) AS count FROM stores WHERE issuer_id='zensho';" --json > /tmp/count.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/count.json"))
          n=int(d[0]["results"][0]["count"])
          print("D1 Zensho rows remain:",n)
          assert n == 4693, n
          PY
