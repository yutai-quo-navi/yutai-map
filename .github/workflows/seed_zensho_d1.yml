name: Seed Zensho D1 (development)

on:
  push:
    branches:
      - main
    paths:
      - "data/issuers/zensho/config.json"
      - "tools/issuers/zensho/scrape.py"
      - "tools/build_d1_issuer_sql.py"
      - ".github/workflows/seed_zensho_d1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-store-db
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.14"

      - name: Run verified Zensho scraper
        run: python tools/issuers/zensho/scrape.py

      - name: Prepare Cloudflare API token
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CF_API_TOKEN }}
        run: |
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$CF_API_TOKEN" || { echo "CF_API_TOKEN is not configured"; exit 1; }
          echo "::add-mask::$CF_API_TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CF_API_TOKEN" >> "$GITHUB_ENV"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Apply D1 schema
        run: npx wrangler d1 execute "4540cbaa-3214-4111-9c7a-11e18fd067db" --remote --file=cloudflare/schema.sql

      - name: Build Zensho D1 sync
        run: python tools/build_d1_issuer_sql.py zensho

      - name: Seed Zensho into D1
        run: npx wrangler d1 execute "4540cbaa-3214-4111-9c7a-11e18fd067db" --remote --file=cloudflare/generated/sync_zensho.sql

      - name: Verify D1 Zensho counts
        run: |
          npx wrangler d1 execute "4540cbaa-3214-4111-9c7a-11e18fd067db" --remote --command "
            SELECT
              (SELECT COUNT(*) FROM stores WHERE issuer_id='zensho') AS geo_count,
              (SELECT COUNT(*) FROM reference_stores WHERE issuer_id='zensho') AS ref_count,
              (SELECT COUNT(*) FROM store_raw WHERE issuer_id='zensho') AS raw_count,
              (SELECT COUNT(*) FROM issuer_state WHERE issuer_id='zensho') AS state_count;
          " --json > /tmp/zensho-counts.json
          cat /tmp/zensho-counts.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/zensho-counts.json"))
          r=d[0]["results"][0]
          geo=int(r["geo_count"]); ref=int(r["ref_count"]); raw=int(r["raw_count"]); state=int(r["state_count"])
          print("zensho geo/raw/ref/state:",geo,raw,ref,state)
          assert geo == 4693, geo
          assert raw == 4693, raw
          assert ref == 0, ref
          assert state == 1, state
          PY

      - name: Verify Worker can search Zensho
        run: |
          BODY="$(curl -fsS 'https://yutai-map-api.yutaisamurai.workers.dev/v1/stores/search?lat=35.6812&lng=139.7671&radius=10000&issuers=zensho')"
          echo "$BODY"
          printf '%s' "$BODY" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if int(d.get("count",0)) > 0 else 1)'

      - name: Verify no private DB files are tracked
        run: |
          if git status --short --untracked-files=all | grep 'data/issuers/zensho/stores/'; then
            echo "Zensho private working DB escaped .gitignore"
            exit 1
          fi
          echo "Zensho D1 seed completed without tracking private store files"
